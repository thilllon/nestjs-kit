pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    format:
      run: pnpm format:check
    secrets:
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  commands:
    conventional-commit:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    build:
      run: pnpm build
    types:
      run: pnpm typecheck
