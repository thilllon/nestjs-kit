name: nestjs-kit-test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nestjs_kit_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: nestjs_kit_test
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=nestjs_kit_test --dbname=nestjs_kit_test",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
