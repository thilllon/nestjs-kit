name: nestjs-kit-test

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nestjs_kit_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: nestjs_kit_test
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=nestjs_kit_test --dbname=nestjs_kit_test",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql

  nats:
    image: nats:2.14.6-alpine
    command: ["--http_port", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-54222}:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka-native:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT:-59092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-59092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.5-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nestjs_kit_test
      RABBITMQ_DEFAULT_PASS: local_test_password
    tmpfs:
      - /var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-55672}:5672"
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    configs:
      - source: mqtt
        target: /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:${MQTT_PORT:-51883}:1883"
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "127.0.0.1",
          "-t",
          "health",
          "-m",
          "ready",
          "-V",
          "mqttv5",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

configs:
  mqtt:
    content: |
      listener 1883
      allow_anonymous true
      persistence false
