packages:
  - "packages/*"
  - "packages/*/examples/*"
allowBuilds:
  "@apollo/protobufjs": false
  "@swc/core": true
  esbuild: true
  protobufjs: false
# Resolve only versions published at least a week ago (minutes).
minimumReleaseAge: 10080

autoInstallPeers: true

# Checks must not mutate the lockfile or run competing installs from parallel hooks.
verifyDepsBeforeRun: false
