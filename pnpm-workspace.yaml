packages:
  - "packages/*"
allowBuilds:
  "@apollo/protobufjs": false
  "@swc/core": true
  esbuild: true
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1135.0"
  - prettier@3.9.8
  - tsx@4.23.15

autoInstallPeers: true

# Checks must not mutate the lockfile or run competing installs from parallel hooks.
verifyDepsBeforeRun: false
