name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: "0"
      TURBO_UI: stream
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      - name: Start PostgreSQL for integration tests
        run: pnpm docker:up
      - name: Test against real PostgreSQL
        run: pnpm test:e2e
      - name: Stop integration services
        if: always()
        run: pnpm docker:down
      - name: Scan tracked files for secrets
        run: gitleaks git --redact --no-banner --log-opts='-1' .
