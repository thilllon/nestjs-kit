name: CI
run-name: ${{ inputs.run_key || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit required by the release workflow
        type: string
        required: true
      run_key:
        description: Unique release validation identifier
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: "0"
      TURBO_UI: stream
    steps:
      - name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:packaging
      - name: Test Better Auth packed consumers on the Node.js engines floor
        run: |
          floor="$(node --print 'require("./packages/nestjs-slightly-better-auth/package.json").engines.node.match(/\d+\.\d+\.\d+/)[0]')"
          test "$(mise exec "node@$floor" -- node --version)" = "v$floor"
          mise exec "node@$floor" -- pnpm test:packaging packages/nestjs-slightly-better-auth/src
      - name: Start integration services
        run: pnpm docker:up
      - name: Test HTTP, database, socket, and broker integrations
        run: pnpm test:e2e
      - name: Stop integration services
        if: always()
        run: pnpm docker:down
      - name: Scan tracked files for secrets
        run: gitleaks git --redact --no-banner --log-opts='--max-count=1' .
