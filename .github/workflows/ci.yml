name: CI
run-name: ${{ inputs.run_key || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit required by the release workflow
        type: string
        required: true
      run_key:
        description: Unique release validation identifier
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: "0"
      TURBO_UI: stream
    steps:
      - name: Verify dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec turbo run test:packaging
      - name: Test packed consumers on each package's Node.js engines floor
        run: |
          # One line per package with a test:packaging script: its engines.node
          # floor, then its directory.
          floors="$(node --eval '
            const { readdirSync, readFileSync } = require("node:fs");
            for (const name of readdirSync("packages").sort()) {
              const directory = `packages/${name}`;
              const manifest = JSON.parse(readFileSync(`${directory}/package.json`, "utf8"));
              if (!manifest.scripts?.["test:packaging"]) {
                continue;
              }
              const [floor] = manifest.engines.node.match(/\d+\.\d+\.\d+/);
              console.log(floor, directory);
            }
          ')"
          while read -r floor directory; do
            test "$(mise exec "node@$floor" -- node --version)" = "v$floor"
            mise exec "node@$floor" -- pnpm --dir "$directory" test:packaging
          done <<< "$floors"
      - name: Test each package's HTTP, database, socket, and broker integrations
        run: |
          # One package at a time: start its Compose services, run its E2E
          # tests, then remove the services before the next package starts.
          status=0
          for file in packages/*/compose.yaml; do
            directory="$(dirname "$file")"
            pnpm --dir "$directory" docker:up && pnpm --dir "$directory" test:e2e || status=1
            pnpm --dir "$directory" docker:down || status=1
          done
          exit "$status"
      - name: Stop integration services
        if: always()
        run: |
          for file in packages/*/compose.yaml; do
            pnpm --dir "$(dirname "$file")" docker:down
          done
      - name: Scan tracked files for secrets
        run: gitleaks git --redact --no-banner --log-opts='--max-count=1' .
