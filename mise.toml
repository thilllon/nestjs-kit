[tools]
node = "lts"
# pnpm does not publish an LTS channel; pin the supported stable release.
pnpm = "12.4.2"
lefthook = "2.1.14"
gitleaks = "8.30.1"

[hooks]
postinstall = "lefthook install"

[tasks.setup]
description = "Install dependencies and Git hooks"
run = ["pnpm install", "lefthook install"]

[tasks.check]
description = "Run offline quality checks"
run = ["pnpm lint", "pnpm format:check", "pnpm check-types", "pnpm test", "pnpm build"]
