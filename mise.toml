[tools]
node = "lts"
pnpm = "12.8.1"
lefthook = "2.1.14"
gitleaks = "8.30.1"

[hooks]
postinstall = "lefthook install"

[tasks.setup]
description = "Install dependencies and Git hooks"
run = ["pnpm install", "lefthook install"]

[tasks.check]
description = "Run offline quality checks"
run = ["pnpm lint", "pnpm format:check", "pnpm typecheck", "pnpm test", "pnpm build", "pnpm test:packaging"]
